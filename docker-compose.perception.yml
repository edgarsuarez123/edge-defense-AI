# docker-compose.perception.yml
# ROS 2 perception stack — separate from docker-compose.dev.yml
#
# Why separate:
#   The ros:humble base image is Ubuntu 22.04. The other services use Python
#   slim images. Sharing one compose file would mean all services inherit the
#   Ubuntu base on rebuild, adding ~400MB per service unnecessarily.
#   Keeping the ROS 2 stack in its own compose file also makes it easy to
#   bring it up/down independently during Week 2-3 development.
#
# Usage:
#   Build:   docker compose -f docker-compose.perception.yml build
#   Pub:     docker compose -f docker-compose.perception.yml run --rm stub_publisher
#   Sub:     docker compose -f docker-compose.perception.yml run --rm stub_subscriber
#   Verify:  docker compose -f docker-compose.perception.yml run --rm ros2 ros2 topic list

services:

  # ── Real perception pipeline ────────────────────────────────────────────────

  image_replay:
    build:
      context: .
      dockerfile: infra/docker/perception.Dockerfile
    command: >
      ros2 run perception_nodes image_replay --ros-args
        -p image_dir:=/data/test/images
        -p fps:=60.0
        -p loop:=true
    # Test images mounted read-only — the node reads but never writes.
    # Path inside container: /data/test/images
    # Path on host: ./data/raw/merged/test/images
    volumes:
      - ./data/raw/merged/test/images:/data/test/images:ro
    networks: [ros2_net]
    environment:
      ROS_DOMAIN_ID: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "source /opt/ros/humble/setup.bash && source /ros2_ws/install/setup.bash && ros2 node list | grep -q image_replay"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  yolo_detector:
    build:
      context: .
      dockerfile: infra/docker/perception.Dockerfile
    command: >
      ros2 run perception_nodes yolo_detector --ros-args
        -p model_path:=/models/best.pt
        -p conf_threshold:=0.25
        -p device:=cuda:0
    # Model weights mounted read-only. After training completes, copy best.pt
    # from runs/detect/runs/train/drone-finetune/weights/best.pt into weights/.
    # To test before training finishes, change model_path to /models/yolo26n.pt.
    volumes:
      - ./weights:/models:ro
    networks: [ros2_net]
    environment:
      ROS_DOMAIN_ID: 0
    restart: unless-stopped
    # GPU reservation: Docker Compose v2 syntax for NVIDIA GPU passthrough.
    # Requires NVIDIA Container Toolkit installed in WSL2 (see README).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "source /opt/ros/humble/setup.bash && source /ros2_ws/install/setup.bash && ros2 node list | grep -q yolo_detector"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s   # model load (~10-15s) + DDS registration

  # ── Stub pipeline (non-GPU testing) ────────────────────────────────────────
  # Start with: docker compose -f docker-compose.perception.yml --profile stubs up

  stub_publisher:
    build:
      context: .
      dockerfile: infra/docker/perception.Dockerfile
    command: ros2 run perception_nodes stub_publisher
    networks: [ros2_net]
    environment:
      ROS_DOMAIN_ID: 0
    restart: unless-stopped
    profiles: ["stubs"]   # not started by default; use --profile stubs
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "source /opt/ros/humble/setup.bash && source /ros2_ws/install/setup.bash && ros2 node list | grep -q stub_publisher"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  stub_subscriber:
    build:
      context: .
      dockerfile: infra/docker/perception.Dockerfile
    command: ros2 run perception_nodes stub_subscriber
    networks: [ros2_net]
    environment:
      ROS_DOMAIN_ID: 0
    restart: unless-stopped
    # Subscriber doesn't need to wait for the publisher —
    # ROS 2 topic discovery is asynchronous. The subscriber will catch
    # messages as soon as the publisher starts.
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "source /opt/ros/humble/setup.bash && source /ros2_ws/install/setup.bash && ros2 node list | grep -q stub_subscriber"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Helper service: run arbitrary ros2 CLI commands in the correct environment
  # Usage: docker compose -f docker-compose.perception.yml run --rm --profile tools ros2 ros2 topic list
  ros2:
    build:
      context: .
      dockerfile: infra/docker/perception.Dockerfile
    networks: [ros2_net]
    environment:
      ROS_DOMAIN_ID: 0
    entrypoint: ["/bin/bash", "-c",
      "source /opt/ros/humble/setup.bash && source /ros2_ws/install/setup.bash && exec \"$@\"",
      "--"]
    command: ["ros2", "--help"]
    profiles: ["tools"]   # Only started when --profile tools is specified

networks:
  ros2_net:
    driver: bridge
    # FUTURE (Week 3): When redis_bridge_node needs to reach Redis in the dev
    # stack, create an external shared network:
    #   docker network create edge_shared
    # Then add edge_shared as an external network in both compose files.
