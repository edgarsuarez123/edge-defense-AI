# Edge compose — resource-constrained to simulate Jetson AGX Orin.
# Constraints: 4 CPUs, 16GB RAM, 75% of one GPU (NVIDIA RTX class).
# Secrets: mounted from /run/secrets/ — never pass secrets as env vars in production.
# Usage: docker compose -f docker-compose.edge.yml up -d

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  api_key:
    file: ./secrets/api_key.txt
  govcloud_db_url:
    file: ./secrets/govcloud_db_url.txt
  govcloud_api_key:
    file: ./secrets/govcloud_api_key.txt

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edge
      POSTGRES_DB: edge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "edge", "-d", "edge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"        # postgres gets 1 of the 4 allocated CPUs
          memory: 2g

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

